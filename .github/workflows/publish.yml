name: publish

# Attaches the release binaries to the GitHub Release release-please created. Runs on tag vX.Y.Z only after the tag's
# own tests (ci.yml, e2e included) have passed.
#   workflow_dispatch   normal path, from release.yml at the release tag
#   push tag v*         escape hatch for a hand-pushed tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v (e.g. 0.4.0); the run must be on tag v<version>"
        type: string
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH, got '${version}'"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::run this on tag v${version}, not ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
